<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home Page</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/reset.css">
</head>
<body>
<header>
    <a href="index.html">
        <img src="assets/svg/header-logo.svg" alt="Logo" width="100" height="64">
    </a>
    <nav class="nav">
        <div class="nav-links">
            <a href="index.html" class="nav-links active">Home</a>
            <a>Story</a>
            <a>Gallery</a>
            <a>Contact Us</a>
        </div>
        <div class="nav-icons">
            <a>
                <img src="assets/svg/header-search-icon.svg" alt="Search" width="22" height="22">
            </a>
            <a>
                <img src="assets/svg/header-profile-icon.svg" alt="Profile" width="24" height="24">
            </a>
        </div>
    </nav>
</header>
<main>
    <section class="hero">
        <div class="hero-content">
            <h1>
                <span class="accent">Let’s talk</span> about <br>
                your next trip!
            </h1>
            <p>Share your favorite travel destination and we will <br>
                feature it in our next blog!</p>
            <div class="hero-cta">
                <button>Share your story</button>
                <div class="hero-cta-icon-button">
                    <img src="assets/svg/watch-highlights-icon.svg" alt="Watch Highlights" width="36" height="36">
                    <a>Watch highlights</a>
                </div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
